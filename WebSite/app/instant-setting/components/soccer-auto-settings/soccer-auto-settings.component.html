<div class="soccer-auto-settings">
  <app-table
  [tableHeaders]="tableHeaders"
  [tableData]="settings"
  [maxHeight]="'225px'"
  [rowTemplate]="customRow"
>
</app-table>


<div class="button-group">
  <app-button (click)="submit()" variant="primary">Submit</app-button>
  <app-button (click)="cancel()" variant="danger">Cancel</app-button>
</div>
</div>

<ng-template #customRow let-row>
  <tr>
    <td>{{ row.settleTypeName }}</td>
    <td>
      <span>
        <app-switch [(ngModel)]="row.enabled" labelOff="Off" labelOn="On" size="mini" (ngModelChange)="onChangeEnabled(row)"/>
      </span>
    </td>
    <td>
      @if(row.settleType !== 1) {
        <app-number-input [(ngModel)]="row.waitingTime"/>
      }
    </td>
    @if(!isMatchType) {
      <td>
        <input type="checkbox" [(ngModel)]="row.isApplyChildMatches" />
      </td>
    }
  </tr>
</ng-template>
