<app-table
  [tableHeaders]="tableHeaders"
  [tableData]="settings"
  [maxHeight]="'225px'"
  [rowTemplate]="customRow"
>
</app-table>


<div style="display: flex; justify-content: center;column-gap: 10px ;margin-top: 10px;">
  <app-button (click)="submit()" variant="primary">Submit</app-button>
  <app-button (click)="cancel()" variant="danger">Cancel</app-button>
</div>

<ng-template #customRow let-row>
  <tr>
    <td>{{ row.settleType }}</td>
    <td>
        <app-switch [(ngModel)]="row.enabled" labelOff="Off" labelOn="On" />
    </td>
    <td>
      <app-number-input [(ngModel)]="row.waitingTime"/>
    </td>
    @if(isApplyMatch) {
      <td>
        <input type="checkbox" ([ngModel])="(row.applyToUnCalMatch)" />
      </td>
    }
  </tr>
</ng-template>
