<div class="provider-selection">
	<h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragBoundary=".cdk-overlay-container"
		cdkDragHandle>
		<label class="title">
			Provider Sources
		</label>
		<button type="button" class="close dialog-close" (click)="close()">X</button>
	</h1>
	<div mat-dialog-content id="modal-body" style="padding: 5px 20px 0 20px !important;">
		<table class="provider-table">
			<thead>
				<tr style="background: #295091; color: white;">
					<th style="padding: 5px 5px;">Active</th>
					<th class="provider">Providers</th>
					<th>Primary</th>
					<th>Secondary</th>
					<th>Unassigned</th>
				</tr>
			</thead>
			<tbody>
				@for(provider of resultSetting.providers; track $index) {
				<tr [ngClass]="{'bg-disabled' : !provider.isActive}">
					<td>
						<div style="margin-top: 5px;">
							<app-switch [(ngModel)]="provider.isActive" labelOn="Yes" labelOff="No" variant="yes" />
						</div>
					</td>
					<td style="text-align: left;">{{ provider.sourceName}} </td>
					<td>
						<div style="margin-top: 5px;">
							<input type="radio" [(ngModel)]="provider.priority" [value]="1" [name]="provider.sourceId.toString()"
							[disabled]="!provider.isActive" />
						</div>
					</td>
					<td>
						<div style="margin-top: 5px;">
							<input type="radio" [(ngModel)]="provider.priority" [value]="2" [name]="provider.sourceId.toString()"
							[disabled]="!provider.isActive" />
						</div>
					</td>
					<td>
						<div style="margin-top: 5px;">
							<input type="radio" [(ngModel)]="provider.priority" [value]="0" [name]="provider.sourceId.toString()"
							[disabled]="!provider.isActive" />
						</div>
					</td>

				</tr>
				}
			</tbody>
		</table>
		<div class="message-box" *ngIf="errorMessage">
			<div class="icon error" style="margin-top: 5px;"></div>
			<div class="message-info error">{{ errorMessage }}</div>
		</div>
		<div class="line"></div>
	</div>

	<div class="bottom">
		<button type="button" style="margin-right: 16px;" class="btn btn-primary" (click)="submit()">Submit</button>
		<button type="button" class="btn btn-danger" (click)="close()">Cancel</button>
	</div>
</div>
