<div class="title">
	<div class="line"></div>
	<div>
		<div class="square-icon"></div>
		Auto Payout Setting
	</div>
	<ul>
		<li>
			<label>Retry-time: </label>
			<input style="width: 40px;" type="text" myOnlyInteger maxlength="4" [(ngModel)]="leagueSettings.RetryTime" />
			<label>&nbsp;seconds. </label>
		</li>
		<li>
			<setting-container [(resultSettings)]="leagueSettings.MainResultSetting" />
		</li>
    <li>
      <setting-container [(resultSettings)]="leagueSettings.EarlyResultSetting"  [isEarly] = "true"/>
    </li>
	</ul>
</div>
