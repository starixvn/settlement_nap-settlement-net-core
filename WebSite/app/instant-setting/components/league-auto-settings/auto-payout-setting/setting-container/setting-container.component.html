<label
	>Requirement for <b>{{ isEarly ? "Early" : "Main" }}</b> results:
</label>
<ul>
	<li>
		<label>Trader source: </label>
		<span style="cursor: pointer;" [ngClass]="resultSettings.hasTrader ? 'toggle-on' : 'toggle-off'"></span>
	</li>
	<li>
		<label>Provider source: </label>
		<ul>
			<li>
				<label>Minimum sources:&nbsp;</label>
				<select [(ngModel)]="resultSettings.minimumTrader">
					<option value="1" [text]="1"></option>
					<option value="2" [text]="2"></option>
				</select>
			</li>
			<li>
				<label>Provider list:&nbsp;</label>
				<button type="button" class="btn btn-outline-primary">Edit...</button>
			</li>

			<ul style="list-style-type: circle;">
				<li>
					<label>Primary: &nbsp;</label>
					{{ resultSettings.primaryTrader }}
				</li>
				<li>
					<label>Secondary: &nbsp;</label>
					{{ resultSettings.secondaryTrader }}
				</li>
			</ul>
		</ul>
	</li>
</ul>
