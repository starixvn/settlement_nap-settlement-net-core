<div class="provider-selection">
	<h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragBoundary=".cdk-overlay-container" cdkDragHandle>
		<label class="title">
			Provider Sources
		</label>
		<button type="button" class="close dialog-close" (click)="close()">X</button>
	</h1>
	<div mat-dialog-content id="modal-body" style="padding: 5px 20px 0 20px !important;">
		<table class="provider-table">
			<thead>
				<th class="provider">Providers</th>
				<th>Primary</th>
				<th>Secondary</th>
				<th>Unassigned</th>
			</thead>
			<tbody>
				<tr *ngFor="let i of providerSources">
					<td>{{ i.sourceName }}</td>
					<td>
						<input type="radio" [(ngModel)]="i.priority" [value]="1" [name]="i.sourceId" />
					</td>
					<td>
						<input type="radio" [(ngModel)]="i.priority" [value]="2" [name]="i.sourceId" />
					</td>
					<td>
						<input type="radio" [(ngModel)]="i.priority" [value]="0" [name]="i.sourceId" />
					</td>
				</tr>
			</tbody>
		</table>
		<div class="line"></div>
	</div>

	<div class="bottom">
		<button type="button" style="margin-right: 16px;" class="btn btn-outline-primary" (click)="submit()">Submit</button>
		<button type="button" class="btn btn-outline-primary" (click)="close()">Cancel</button>
	</div>
</div>
