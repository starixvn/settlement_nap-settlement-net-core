<span toastContainer></span>
<div class="league-setting" *ngIf="leagueName != null">
	<div class="league">
		<div class="icon"></div>
		{{ leagueName }}
	</div>
	<div class="line"></div>
	<div class="content">
		<auto-setting [autoSetting]="autoSetting" />
		<time-setting [directSetting]="true" [waitingTime]="waitingTime" />
		<time-setting [directSetting]="false" [waitingTime]="refundWaitingTime" />
		<auto-payout-setting [retryTime]="retryTime"> </auto-payout-setting>
	</div>
	<div class="line"></div>
	<div class="bottom">
		<button type="button" style="margin-right: 16px;" class="btn btn-primary" (click)="submit()">Submit</button>
		<button type="button" class="btn btn-danger" (click)="cancel()">Cancel</button>
	</div>
</div>
