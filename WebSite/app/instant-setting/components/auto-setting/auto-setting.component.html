<div class="auto-container">
  <ng-container class="auto-container" *ngIf="isMultiSelect; else singleSelect">
    <ng-container *ngFor="let item of listSetting">
      <div class="check-box">
        <input
          type="checkbox"
          [id]="item.text"
          [(ngModel)]="item.isEnable"
        />&nbsp;<label [for]="item.text">{{ item.text }}</label>
      </div>
    </ng-container>
  </ng-container>

  <ng-template #singleSelect>
    <ng-container class="auto-container">
      <div style="display: flex; justify-content: center">
        <div style="text-align: left">
          <div class="check-box">
            <input
              type="radio"
              id="auto-payout-setting"
              [(ngModel)]="currentState"
              [value]="1"
            />&nbsp;<label for="auto-payout-setting">Auto Payout</label>
          </div>
          <div class="check-box">
            <input
              type="radio"
              id="direct-setting"
              [(ngModel)]="currentState"
              [value]="5"
            />&nbsp;<label for="direct-setting">Direct Payout</label>
          </div>
          <div class="check-box">
            <input
              type="radio"
              id="off-setting"
              [(ngModel)]="currentState"
              [value]="0"
            />&nbsp;<label for="off-setting">OFF</label>
          </div>
        </div>
      </div>
    </ng-container>
  </ng-template>

  <div>
    <button class="button" (click)="submit()">Submit</button>
  </div>

  <div class="message-box" *ngIf="errorMessage">
    <div class="icon error"></div>
    <div class="message-info error">{{ errorMessage }}</div>
  </div>
</div>
