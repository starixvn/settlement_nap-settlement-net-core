<div class="container setting-container">
    <div class="remark-line row">
        <div class="remark-label col-8">
            MTD. Hold
        </div>
        <div class="remark-status col-4">
            <div class="remark-icon" [ngClass]="{'icon-yes': remark?.isMtdHold && permission?.canMarkUnDecided, 'icon-no': !remark?.isMtdHold && permission?.canMarkUnDecided,
                'icon-yes-disabled': remark?.isMtdHold && !permission?.canMarkUnDecided, 'icon-no-disabled': !remark?.isMtdHold && !permission?.canMarkUnDecided}"
                placement="bottom" [ngbTooltip]="remark?.isMtdHold ? tooltipMessage.unmarkMTDHold : tooltipMessage.markMTDHold"
                [disableTooltip]="!permission?.canMarkUnDecided"
                (click)="permission?.canMarkUnDecided ? changeMTDHoldSetting() : ''"></div>
        </div>
    </div>
    <div class="remark-line row">
        <div class="remark-label col-8">
            Undecided
        </div>
        <div class="remark-status col-4">
            <div class="remark-icon" [ngClass]="{'icon-yes': remark?.isUndecided && permission?.canMarkUnDecided, 'icon-no': !remark?.isUndecided && permission?.canMarkUnDecided,
                'icon-yes-disabled': remark?.isUndecided && !permission?.canMarkUnDecided, 'icon-no-disabled': !remark?.isUndecided && !permission?.canMarkUnDecided}"
                placement="top" [ngbTooltip]="remark?.isUndecided ? tooltipMessage.unmarkUndecided : tooltipMessage.markUndecided"
                [disableTooltip]="!permission?.canMarkUnDecided"
                (click)="permission?.canMarkUnDecided ? changeUndecidedSetting() : ''"></div>
        </div>
    </div>
    <div class="remark-line row">
        <div class="remark-label col-8">
            Result Pending
        </div>
        <div class="remark-status col-4">
            <div class="remark-icon" [ngClass]="{'icon-yes': remark?.isPending && permission?.canMarkPending, 'icon-no': !remark?.isPending && permission?.canMarkPending,
                'icon-yes-disabled': remark?.isPending && !permission?.canMarkPending, 'icon-no-disabled': !remark?.isPending && !permission?.canMarkPending}"
                placement="top" [ngbTooltip]="remark?.isPending ? tooltipMessage.unmarkPending : tooltipMessage.markPending"
                [disableTooltip]="!permission?.canMarkPending"
                (click)="permission?.canMarkPending ? changePendingSetting() : ''"></div>
        </div>
    </div>
    <div class="remark-line row">
        <div class="remark-label col-8">
            Under Settlement
        </div>
        <div class="remark-status col-4">
            <div class="remark-icon" [ngClass]="{'icon-yes': remark?.isUnderSettle && permission?.canMarkUnDecided, 'icon-no': !remark?.isUnderSettle && permission?.canMarkUnDecided,
                'icon-yes-disabled': remark?.isUnderSettle && !permission?.canMarkUnDecided, 'icon-no-disabled': !remark?.isUnderSettle && !permission?.canMarkUnDecided}"
                placement="top" [ngbTooltip]="remark?.isUnderSettle ? tooltipMessage.unmarkUnderSettle : tooltipMessage.markUnderSettle"
                [disableTooltip]="!permission?.canMarkUnDecided"
                (click)="permission?.canMarkUnDecided ? changeUnderSettleSetting() : ''"></div>
        </div>
    </div>

    <div class="remark-line row">
        <div class="remark-label disabled col-8">
            Hold Key
        </div>
        <div class="remark-status col-4">
            <div class="remark-icon" [ngClass]="{'icon-yes-disabled': remark?.isKeyHold, 'icon-no-disabled': !remark?.isKeyHold}"></div>
        </div>
    </div>
    <div class="message-box" *ngIf="errorMessage">
        <div class="icon error"></div>
        <div class="message-info error">{{errorMessage}}</div>
    </div>
</div>
