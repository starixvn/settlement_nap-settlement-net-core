    <div style="display: flex;justify-content: center;">
        <table *ngIf="remark" class="hold-setting-table">
          
                <tr class="header-setting">
                    <th style="width: 120px;">Hold State</th>
                    <th style="width: 20px;text-align: center;">No</th>
                    <th style="width: 40px;text-align: center;">Yes</th>
                    <th style="text-align: center;width: 155px;">Aplly to all child-matches</th>
                </tr>
            <tbody>
                <tr>
                    <td>MTD. Hold</td>
                    <td class="text-center"><input type="radio" [(ngModel)]="remark.isMtdHold" [value]="false" name="isMtdHold"
                            [disabled]="!permission?.canMarkUnDecided" /></td>
                    <td class="text-center"><input type="radio" [(ngModel)]="remark.isMtdHold" [value]="true" name="isMtdHold"
                            [disabled]="!permission?.canMarkUnDecided" /></td>
                    <td class="text-center"><input type="checkbox" [(ngModel)]="isApplyChild" /></td>
                </tr>
                <tr>
                    <td>Undecided</td>
                    <td class="text-center"><input type="radio" [(ngModel)]="remark.isUndecided" [value]="false" name="isUndecided"
                            [disabled]="!permission?.canMarkUnDecided" /></td>
                    <td class="text-center"><input type="radio" [(ngModel)]="remark.isUndecided" [value]="true" name="isUndecided"
                            [disabled]="!permission?.canMarkUnDecided" /></td>
                    <td class="text-center"></td>
                </tr>
                <tr>
                    <td>Result Pending</td>
                    <td class="text-center"><input type="radio" [(ngModel)]="remark.isPending" [value]="false" name="isPending"
                            [disabled]="!permission?.canMarkPending" /></td>
                    <td class="text-center"><input type="radio" [(ngModel)]="remark.isPending" [value]="true" name="isPending"
                            [disabled]="!permission?.canMarkPending" /></td>
                    <td class="text-center"></td>
                </tr>
                <tr>
                    <td>Under Settlement</td>
                    <td class="text-center"><input type="radio" [(ngModel)]="remark.isUnderSettle" [value]="false" name="isUnderSettle"
                            [disabled]="!permission?.canMarkUnDecided" /></td>
                    <td class="text-center"><input type="radio" [(ngModel)]="remark.isUnderSettle" [value]="true" name="isUnderSettle"
                            [disabled]="!permission?.canMarkUnDecided" /></td>
                    <td></td>
                </tr>
                <tr>
                    <td class="disabled"> Hold Key</td>
                    <td class="text-center"><input type="radio" [(ngModel)]="remark.isKeyHold" [value]="false" name="isKeyHold" disabled />
                    </td>
                    <td class="text-center"><input type="radio" [(ngModel)]="remark.isKeyHold" [value]="true" name="isKeyHold" disabled />
                    </td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="remark" style="margin-top: 20px;display: flex;justify-content: center;">
        <button type="button" style="margin-right: 16px;" class="button" (click)="submit()">Submit</button>
        <button type="button" class="button" (click)="cancel()">Cancel</button>
    </div>
    <div class="message-box" *ngIf="errorMessage">
        <div class="icon error"></div>
        <div class="message-info error">{{errorMessage}}</div>
    </div>
</div>
