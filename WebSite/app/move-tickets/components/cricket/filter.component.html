<div class="filter-bar">
    <div class="line">
    </div>
    <div class="filter-bar-inner">
        <div class="row filter-row">
            <div class="col-md-2 field">
                <label for="FromDate" class="inner-label from-date">
                    From
                </label>
                <ngbd-date-picker [date]="fromDate" (change)="onSelectFromDate($event)"></ngbd-date-picker>
            </div>
            <div class="col-md-2 field">
                <label for="ToDate" class="inner-label to-date">
                    To
                </label>
                <ngbd-date-picker [date]="toDate" (change)="onSelectToDate($event)"></ngbd-date-picker>
            </div>
            <div class="col-md-2 field">
                <label for="MatchStatus" class="inner-label">
                    Match Status
                </label>
                <div>
                    <new-multiple-select (formValue)="onSelectMatchStatus($event)" [multipleSelect]="matchStatusSelect"></new-multiple-select>
                </div>
            </div>
            <div class="move-ticket-setting-container">
                <label for="MoveTicketSetting" class="inner-label">Auto move tickets status</label>
                <button id="MoveTicketSetting" class="button" type="button" (click)="toggleAutoMoveTicketsStatus()">
                    {{ isAutoMoveTicketsEnabled ? 'On' : 'Off' }}
                </button>
            </div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-md-2 field">
                <label for="MatchCode" class="inner-label">
                    Match Code/ID 
                </label>
                <input id="MatchCode" maxlength="50" name="MatchCode" style="width: 107px" type="text" value="" [(ngModel)]="matchCode">
            </div>
            <div class="col-md-2 field">
                <label for="Sports" class="inner-label">
                    Sports
                </label>
                <div>
                    <select class="sport-select" [(ngModel)]="sportTypesSelected" (change)="onChangeSport($event)">
                        <option value="8">Baseball</option>
                        <option value="50">Cricket</option>
                    </select>
                </div>
            </div>
            <div id="leagues" class="col-md-4 field">
                <label for="Leagues" class="inner-label leagues">
                    League
                </label>
                <div>
                    <new-multiple-select [style.width]="leagueSelect.maxWidth" (formValue)="onSelectLeague($event)" [multipleSelect]="leagueSelect"></new-multiple-select>
                </div>
            </div>
            <div class="col-md-1 field include-test">
                <input id="IsIncludeTest" name="IsIncludeTest" type="checkbox" value="true" [(ngModel)]="isIncludeTestMatch">
                <label for="IsIncludeTest" class="bold">&nbsp;Include Test Matches</label>
            </div>
            <div class="col-sm-1 submit field">
                <button class="button" (click)="search()">Submit</button>
            </div>
        </div>
    </div>
    <div class="line">
    </div>
</div>
