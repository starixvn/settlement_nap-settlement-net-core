<table class="table-calculation fast-markets">
    <thead>
        <tr>
            <th rowspan="2" class="time-interval">
                <div>Interval</div>
                <div>
                    <new-multiple-select class="multiple-select" [multipleSelect]="timeIntervalSelect"
                    (formValue)="changeTimeInterval($event)"></new-multiple-select>
                </div>
            </th>
            <th rowspan="2" class="ticket-status">
                Ticket Status
                <div>
                    <new-multiple-select class="multiple-select" [multipleSelect]="ticketStatusSelect"
                    (formValue)="changeTicketStatus($event)"></new-multiple-select>
                </div>
            </th>
            <th colspan="8" class="result">Result</th>
            <th rowspan="2" class="result-status">
                Result Status
                <div>
                    <new-multiple-select class="multiple-select" [multipleSelect]="resultStatusSelect"
                    (formValue)="changeResultStatus($event)"></new-multiple-select>
                </div>
            </th>
            <th rowspan="2" class="select-proceed">
                <label>
                    Select to Proceed
                    <input type="checkbox" [checked]="checkedProceed" [(ngModel)]="filter.checked"
                        (change)="onChangeProceed($event.target.checked)" />
                </label>
            </th>
        </tr>
        <tr class="result">
            <th>None</th>
            <th>Goal</th>
            <th>Corner</th>
            <th>Free Kick</th>
            <th>Goal Kick</th>
            <th>Throw In</th>
            <th>Booking</th>
            <th>Penalty</th>
        </tr>
    </thead>
</table>
