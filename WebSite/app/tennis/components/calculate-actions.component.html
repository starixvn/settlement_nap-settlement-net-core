<span toastContainer></span>
<div class="padding" *ngIf="match">
  <div *ngIf="isReadyMatch">
    <calculate-match-detail [match]="match"></calculate-match-detail>
    <ticket-count [ticketCounts]="match.ticketCounts"></ticket-count>
    <div class="calculation-actions">
      <div *ngIf="hedgeMatchDetail" class="hedge-match">
        <input type="checkbox" [(ngModel)]="applyHedgeMatch" id="ApplyHedgeMatch" />
        <label for="ApplyHedgeMatch">Apply for hedge match '<strong>{{hedgeMatchDetail.matchCode}}</strong>'
          also.</label>
      </div>
      <table>
        <ng-template *ngTemplateOutlet="header"></ng-template>
        <ng-template *ngTemplateOutlet="body"></ng-template>
      </table>
      <resettle-checker (proceedEvent)="onResettleCheckboxChange($event)" [checked]="isReSettledTickets">
      </resettle-checker>
    </div>
  </div>
  <div *ngIf="!isReadyMatch">
    <not-ready-match></not-ready-match>
  </div>
</div>
<ng-template #header>
  <thead>
    <tr>
      <th rowspan="2" class="map">Set/Match</th>
      <th rowspan="2" class="ticket-status">Ticket Status</th>
      <th rowspan="2" colspan="2" class="map">Final Score</th>
      <th rowspan="2" class="map" *ngIf="isLeader">Trader Score</th>
      <th [colSpan]="maxProviderCol" class="map" *ngIf="isLeader">Provider Score</th>
      <th [colSpan]="outSideCount * 2">Outside Score</th>
      <th rowspan="2" class="status">
        Select to Proceed
      </th>
    </tr>
    <tr>
      <ng-container *ngFor=" let result of match.resultDetails[0].externalScores | slice:1; let i=index">
        <th class="map" *ngIf="i < maxProviderCol && isLeader">{{result.sourceName|externalSourceName}}</th>
        <th class="map" *ngIf="i === maxProviderCol" colspan="2">{{result.sourceName}}</th>
        <th class="map" colspan="2" *ngIf="i > maxProviderCol">
          <div class="outside-source-text" [matTooltip]="getTextTooltip(result.sourceName, 12)">
            <a href="{{result.remark}}" target="_blank" class="source-link">{{result.sourceName}}</a>
          </div>
        </th>
      </ng-container>
    </tr>
  </thead>
</ng-template>
<ng-template #body>
  <tbody>
    <tr *ngFor="let map of match.resultDetails; let i=index; let last=last;"
      [ngClass]="{'mismatched': map.isScoreMismatched, 'confirmed-refund': match.permission.isLeader && map.resultSettingData.isConfirmedRefund}">
      <td>{{ map.resourceId | resourceName}}</td>
      <td [ngClass]="map.ticketStatus.toLowerCase()" class="set-status"
        *ngIf="map.resourceId !== totalGamesId && !last">{{map.ticketStatus}}</td>
      <td [ngClass]="map.ticketStatus.toLowerCase()" class="match-status" *ngIf="map.resourceId === totalGamesId"
        rowspan="2">{{map.ticketStatus}}</td>
      <td [ngClass]="getClass(map)">
        <input type="text" myOnlyInteger tabindex="{{i*2 + 1}}" [disabled]="isFinalScoreDisabled(map)"
          [(ngModel)]="map.homeValue" (ngModelChange)="checkMapIsMatched(map)" [ngClass]="{
                 'final-score' : last ,
                 'warning' : map.resourceId === totalGamesId ? false : isErrorOnVerification(map, map.homeValue)}" />
      </td>
      <td [ngClass]="getClass(map)">
        <input type="text" myOnlyInteger [disabled]="isFinalScoreDisabled(map)" [(ngModel)]="map.awayValue"
          (ngModelChange)="checkMapIsMatched(map)" [ngClass]="{
                    'final-score' : last,
                    'warning' : map.resourceId === totalGamesId ? false : isErrorOnVerification(map, map.awayValue)}"
          tabindex="{{(i+1) * 2}}" />
      </td>
      <ng-container *ngFor="let result of map.externalScores; let x=index">
        <td *ngIf="x < (maxProviderCol +1) && isLeader">
          {{result.homeValue}}-{{result.awayValue}}
        </td>
        <ng-container *ngIf="x >= (maxProviderCol +1)">
          <td [ngClass]="{'striped': x % 2 === 1}">
            <input type="text" myOnlyInteger [(ngModel)]="result.homeValue" id="outside-{{i*2 + 1}}"
              [disabled]="isFinalScoreDisabled(map, true)" (change)="verifyAndAutoFillScore(map, last)"
              (ngModelChange)="updateOutsideScore(result.sourceId)" />
          </td>
          <td [ngClass]="{'striped': x % 2 === 1}">
            <input type="text" myOnlyInteger [(ngModel)]="result.awayValue" id="outside-{{(i+1) * 2}}"
              [disabled]="isFinalScoreDisabled(map, true)" (change)="verifyAndAutoFillScore(map, last)"
              (ngModelChange)="updateOutsideScore(result.sourceId)" />
          </td>
        </ng-container>
      </ng-container>
      <td *ngIf="map.resourceId === totalGamesId" rowspan="2">
        <input id="final-checkbox" type="checkbox" [(ngModel)]="match.resultDetails[i+1].checked"
          (ngModelChange)="selectedOnLastMap()" />
      </td>
      <td *ngIf="map.resourceId !== totalGamesId && !last">
        <input id="checkbox-map-{{i + 1}}" type="checkbox" [(ngModel)]="map.checked" [disabled]="match.isScoreDirect"
          (ngModelChange)="selectedOnMap()" />
      </td>
    </tr>
    <tr>
      <td colspan="100%" class="input-directly">
        <input type="checkbox" [(ngModel)]="match.isScoreDirect" (ngModelChange)="changeInputDirectly()"
          id="isScoreDirect" [disabled]="disableScoreDirect" />
        <label for="isScoreDirect">Input Match score directly</label>
      </td>
    </tr>
    <tr>
      <td colSpan="100%" class="button-group">
        <button class="button" (click)="calculate()">Calculate</button>
        <button *ngIf="match.permission.canUncalculate"
          [ngClass]="{'button': true, 'button-disabled': !enableUncalculate}" [disabled]="!enableUncalculate"
          (click)="uncalculate()">
          Uncalculate
        </button>
        <button class="new-refund-button save-score" [disabled]="isSaveScoreDisabled()" (click)="saveScore()">Save
          Score</button>
      </td>
    </tr>
  </tbody>
</ng-template>

<div *ngIf="blockUI" class="in modal-backdrop">
  <div class="loading">
  </div>
</div>
