<mat-form-field [style.width]="multipleSelect.maxWidth">
    <mat-label class="px-2">{{status}}</mat-label>
    <input *ngIf="multipleSelect.enableSearchBox" [ngClass]="{'above': isOpened, 'mat-search-box' : true}" matInput
        (click)="dropdown.open()" [(ngModel)]="searchText" (input)="search()">
    <mat-select #dropdown [formControl]="formControl" (openedChange)="checkOpenState($event)" (click)="scrollTop()"
        [disabled]="disabled" multiple>
        <mat-select-trigger></mat-select-trigger>
        <mat-option #allSelected *ngIf="items.length > 0" class="px-2 select-all" (click)="selectAllSelection()"
            [value]="0" [hidden]="multipleSelect.disableCheckAll || searchTextNotEmpty">
            {{multipleSelect.checkAllCheckBoxText}}</mat-option>

        <cdk-virtual-scroll-viewport [itemSize]="20" *ngIf="groups.length > 0 && searchTextEmpty">
            <mat-expansion-panel *ngFor="let group of groups" [expanded]="true" #panel>
                <mat-expansion-panel-header>
                    <mat-panel-title title="{{group.name}}">
                        <mat-checkbox (click)="selectGroupParent($event, group.name, group.selected)"
                            [(ngModel)]="group.selected">
                            {{group.name}}
                        </mat-checkbox>
                    </mat-panel-title>
                </mat-expansion-panel-header>
                <ng-container *ngFor="let item of items">
                    <mat-option *ngIf="item.type == group.name && item.isShow" [value]="item"
                        (click)="selectOneInGroup(group.name, item)" title="{{item.text}}">
                        {{item.text}}
                    </mat-option>
                </ng-container>
            </mat-expansion-panel>
        </cdk-virtual-scroll-viewport>

        <cdk-virtual-scroll-viewport [itemSize]="20" *ngIf="groups.length === 0 || !searchTextEmpty">
            <ng-container *ngFor="let item of items;let first = first">
                <div *ngIf="first" name="top"></div>
                <mat-option *ngIf="item.isShow && item.includeSearchText" [value]="item" [disabled]="!item.enable"
                    (click)="groups.length > 0 ? selectOneInGroup(item.type, item) : selectPerOne(item)" title="{{item.text}}">
                    {{item.text}}
                </mat-option>
            </ng-container>
        </cdk-virtual-scroll-viewport>
        <div *ngIf="multipleSelect.enableSearchBox && notExistItemIncludeSearchText">
            &nbsp;No Data
        </div>
    </mat-select>
</mat-form-field>
