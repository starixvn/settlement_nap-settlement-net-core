<div class="modal-header">
    <div class="modal-title">{{title}}</div>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.close()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body content-fixed-height">
    <p [innerHTML]="message"></p>
    @if(requireCheckbox) {
    <div class="check-box">
        <label for="checkbox" style="word-wrap:break-word">
            <input id="checkbox" type="checkbox" [(ngModel)]="isChecked" />
            {{checkboxLabel}}
        </label>
    </div>
    }
</div>
<div class="modal-footer">
    <button [disabled]="requireCheckbox && !isChecked" type="button" class="btn btn-danger" ngbAutofocus
        (click)="activeModal.dismiss(yes)">{{yes}}</button>
    <span [hidden]="hideNo">
        <button type="button" class="btn btn-light" (click)="activeModal.dismiss(no)">{{no}}</button>
    </span>
</div>
