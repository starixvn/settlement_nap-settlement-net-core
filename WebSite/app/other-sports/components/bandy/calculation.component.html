<span toastContainer></span>
<div *ngIf="match">
  <div *ngIf="isReadyMatch">
    <div class="padding">
      <match-info [matchDetail]="matchDetail" [resultDetails]="resultDetails" />
      <ticket-count [ticketCounts]="match.ticketCounts"></ticket-count>
    </div>
    
    <div class="calculation-actions">
      <table>
        <ng-template *ngTemplateOutlet="calcHeader"></ng-template>
        <ng-template *ngTemplateOutlet="calcBody"></ng-template>
      </table>
    </div>
  </div>
  <div *ngIf="!isReadyMatch">
    <not-ready-match></not-ready-match>
  </div>
</div>


<ng-template #calcHeader>
  <thead>
    <tr>
      <th scope="col" rowspan="2" class="code">Result</th>
      <th scope="col" rowspan="2" class="ticket-status">Ticket Status</th>
      <th scope="col" rowspan="2" colspan="2" class="kick-off-time">Score</th>
      <th>Provider Score</th>
      <th scope="col" rowspan="2">Select to Proceed</th>
    </tr>
    <tr>
      <ng-container *ngFor="let externalResult of externalResults">
        <th class="code">
          {{externalResult.sourceName}}
          <span [ngClass]="{ 'icon-copy': true, 'disable-copy': true }"></span>
        </th>
      </ng-container>

    </tr>
  </thead>
</ng-template>

<ng-template #calcBody>
  <ng-container *ngFor="let result of resultDetails; let i = index; let last = last">
    <tr [ngClass]="{'mismatched': false}">
      <td>
        {{ result.resourceId | resourceName: matchDetail.sportType }}
      </td>

      <td *ngIf="isFistHalf(result.resourceId)" [ngClass]="result.ticketStatus?.toLowerCase()">{{result.ticketStatus}}
      </td>
      <td *ngIf="isMatchResult(result.resourceId)" [rowSpan]="4" [ngClass]="result.ticketStatus?.toLowerCase()">
        {{result.ticketStatus}}</td>

      <td [ngClass]="{'mismatched': false}">
        <input type="text" myOnlyInteger tabindex="{{ i * 2 + 1 }}" [(ngModel)]="result.homeValue" (ngModelChange)="changeScore()"
          [disabled]="result.resourceId === '00' || (result.resourceId === 'ET' && disabledET) || (result.resourceId === 'PEN' && disbaledPEN)"
          [ngClass]="{'warning' :true}" />
      </td>
      <td [ngClass]="{'mismatched': false}">
        <input type="text" myOnlyInteger tabindex="{{ (i + 1) * 2 }}" [(ngModel)]="result.awayValue" (ngModelChange)="changeScore()"
          [disabled]="result.resourceId === '00' || (result.resourceId === 'ET' && disabledET) || (result.resourceId === 'PEN' && disbaledPEN)"  [ngClass]="{'warning' :true}"/>
      </td>
      <ng-container *ngFor="let externalResult of externalResults">
        <td>{{ viewExternalScore(result.resourceId,externalResult)}}</td>
      </ng-container>

      <td *ngIf="isFistHalf(result.resourceId)" [ngClass]="result.ticketStatus?.toLowerCase()"><input type="checkbox"
          [(ngModel)]="result.checked" (ngModelChange)="onCheckboxChange($event,result.resourceId)"/></td>
      <td *ngIf="isMatchResult(result.resourceId)" [rowSpan]="4" [ngClass]="result.ticketStatus?.toLowerCase()"><input
          type="checkbox" [(ngModel)]="result.checked" (ngModelChange)="onCheckboxChange($event,result.resourceId)"/></td>

    </tr>
  </ng-container>

  <tr>
    <td colSpan="100%" class="button-group">
      <button class="button" *ngIf="permission.canCalculate" (click)="calculation()"
        [disabled]="!existsSelectedResult">Calculate
        All</button>
      <button class="button" *ngIf="permission.canUncalculate" [disabled]="!existsSelectedResult"
        (click)="uncalculation()">Uncalculate</button>
    </td>
  </tr>
</ng-template>
