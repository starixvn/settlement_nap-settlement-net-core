<span toastContainer></span>

<div *ngIf="match">
  <div *ngIf="isReadyMatch">
    <div class="padding">
      <match-info [matchDetail]="matchDetail" [resultDetails]="resultDetails" />
      <ticket-count [ticketCounts]="match.ticketCounts"></ticket-count>
    </div>
    
    <div class="calculation-actions">
      <table>
        <ng-template *ngTemplateOutlet="calcHeader"></ng-template>
        <ng-template *ngTemplateOutlet="calcBody"></ng-template>
      </table>
    </div>
  </div>
  <div *ngIf="!isReadyMatch">
    <not-ready-match></not-ready-match>
  </div>

  <resettle-checker (proceedEvent)="onResettleCheckboxChange($event)"
  [checked]="isReSettledTickets"></resettle-checker>
</div>


<ng-template #calcHeader>
  <thead>
    <tr>
      <th scope="col" rowspan="2" class="code">Result</th>
      <th scope="col" rowspan="2" class="ticket-status">Ticket Status</th>
      <th scope="col" rowspan="2" colspan="2" class="kick-off-time">Score</th>
      <th  *ngIf="isLeader && externalResults.length">Provider Score</th>
      <th scope="col" rowspan="2" class="kick-off-time" >Select to Proceed</th>
    </tr>
    <tr>
      <ng-container *ngIf="isLeader && externalResults.length" >
        <th  class="code" *ngFor="let externalResult of externalResults">
          {{externalResult.sourceName}}
          <span [ngClass]="{ 'icon-copy': true, 'disable-copy': false }" (click)="copyScore()"></span>
        </th>
      </ng-container>

    </tr>
  </thead>
</ng-template>

<ng-template #calcBody>
  <ng-container *ngFor="let result of resultDetails; let i = index; let last = last">
    <tr    [ngClass]="{'mismatched': result.isScoreMismatched, 'confirmed-refund': isConfirmed(result)}">
      <td>
        {{ result.resourceId | badyResourceName}}
      </td>

      <td *ngIf="isFistHalf(result.resourceId)" [ngClass]="result.ticketStatus?.toLowerCase()" class="set-status">{{result.ticketStatus}}
      </td>
      <td *ngIf="isFulltimeResult(result.resourceId)" rowSpan="4" [ngClass]="result.ticketStatus?.toLowerCase()" class="match-status">
        {{result.ticketStatus}}</td>

      <td [ngClass]="[getConfirmedBackground(result, last), getIntervalBackground(result.settlementStatusId)]" [ngClass]="{'col-mismatched' : result.inValid}">
        <input type="text" 
          myOnlyInteger 
          tabindex="{{ i * 2 + 1 }}" [(ngModel)]="result.homeValue" 
          (ngModelChange)="verifyAndAutoFillScore(result)"
          [disabled]="result.disabled"
          [ngClass]="{'warning' :isErrorOnVerification(result)}" 
       
          />
      </td>
      <td  [ngClass]="[getConfirmedBackground(result, last),getIntervalBackground(result.settlementStatusId)]" [ngClass]="{'col-mismatched' : result.inValid}">
        <input type="text" 
          myOnlyInteger 
          tabindex="{{ (i + 1) * 2 }}" 
          [(ngModel)]="result.awayValue" 
          (ngModelChange)="verifyAndAutoFillScore(result)"
          [disabled]="result.disabled"
          [ngClass]="{'warning' :isErrorOnVerification(result)}"/>
      </td>


      <ng-container *ngIf="isLeader && externalResults.length">
        <td  *ngFor="let externalResult of externalResults">{{ viewExternalScore(result.resourceId,externalResult)}}</td>
      </ng-container>

      <td *ngIf="isFistHalf(result.resourceId)" [ngClass]="result.ticketStatus?.toLowerCase()"><input type="checkbox"
          [(ngModel)]="result.checked" (ngModelChange)="onSelectResult($event,result.resourceId)"/></td>
      <td *ngIf="isFulltimeResult(result.resourceId)" rowSpan="4" [ngClass]="result.ticketStatus?.toLowerCase()">
        <input id="final-checkbox" type="checkbox" [(ngModel)]="result.checked" (ngModelChange)="onSelectResult($event,result.resourceId)"/>
      </td>

    </tr>
  </ng-container>

  <tr>
    <td colSpan="100%" class="button-group">
      <button class="button" *ngIf="permission.canCalculate" (click)="calculation()"
        [disabled]="!existsSelectedResult">Calculate
        All</button>
      <button class="button" *ngIf="permission.canUncalculate" [disabled]="!existsSelectedResult"
        (click)="uncalculation()">Uncalculate</button>
    </td>
  </tr>
</ng-template>
