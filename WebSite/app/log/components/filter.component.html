<div class="filter-bar">
    <div class="line">
    </div>
    <div class="filter-bar-inner">
        <div class="row">
            <div class="col-md-3">
                <label for="MatchCode" class="inner-label">
                    MatchCode/ID
                </label>
                <input name="matchCode" maxlength="50" type="text" [(ngModel)]="filter.matchCode" class="match-code">
            </div>
            <div class="col-md-2">
                <label for="FromDate" class="inner-label from-date">
                    From
                </label>
                <ngbd-date-picker [date]="filter.fromDate" (change)="onSelectFromDate($event)"></ngbd-date-picker>
            </div>
            <div class="col-md-2">
                <label for="ToDate" class="inner-label to-date">
                    To
                </label>
                <ngbd-date-picker [date]="filter.toDate" (change)="onSelectToDate($event)"></ngbd-date-picker>
            </div>
            <div class="col-md-2" [hidden]="isHideLogType">
                <label for="productType" class="inner-label">
                    Log Type
                </label>
                <select [(ngModel)]="filter.productType">
                    <ng-container *ngFor="let item of filterType">
                        <option [value]='item.value'>{{item.title}}</option>
                    </ng-container>
                
                </select>
            </div>
            <div class="col-sm-1">
                <button class="button" (click)="search()">Submit</button>
            </div>
        </div>
    </div>
    <div class="line">
    </div>
</div>
