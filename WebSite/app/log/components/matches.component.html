<div [ngClass]="scrollName" *ngIf="matches">
    <ng-template ngFor let-match [ngForOf]="matches">
        <div class="clear-both">
        </div>
        <div (click)="onCollapsedClick(match)">
            <div class="league">
                <div class="btn-left">
                </div>
                <div class="btn-middle">
                    <span>{{match.leagueName}}</span>
                </div>
                <div [ngClass]="getBackgroundIcon(match.collapsed)">
                </div>
            </div>
        </div>
        <ng-container *ngIf="isResettleLog; else logDetail">
            <resettle-log-detail [match]="match"></resettle-log-detail>
        </ng-container>
        <ng-template #logDetail>
            <log-detail [match]="match"></log-detail>
        </ng-template>
    </ng-template>
</div>
<div *ngIf="matches.length == 0" class="no-data">
    <div class="header">Event From {{fromDate | date : 'mediumDate'}} To {{toDate | date : 'mediumDate'}}</div>
    <div class="empty-data">
        There is no information available
    </div>
</div>
