<span toastContainer></span>
<div class="padding" *ngIf="match">
	<calculation-match-detail [match]="originalMatch"></calculation-match-detail>
	<div class="refund-actions">
		<div class="normal-tickets">
			<div class="icon"></div>
			Normal Tickets
		</div>
		<div *ngIf="hedgeMatchDetail" class="hedge-match">
			<input type="checkbox" [(ngModel)]="applyHedgeMatch" id="ApplyHedgeMatch" />
			<label for="ApplyHedgeMatch"
				>Apply for hedge match '<strong>{{ hedgeMatchDetail.matchCode }}</strong
				>' also.</label
			>
		</div>
		<table>
			<thead>
				<tr>
					<th scope="col" class="resource-name">Quarter/HT/FT</th>
					<th scope="col" colspan="2" class="result">
						Result
					</th>
					<th scope="col" class="status">
						Select to Proceed
					</th>
				</tr>
			</thead>
			<tbody>
				<tr *ngFor="let game of resultDetails, let i = index " [ngClass]="{ 'confirmed-refund': permission.isLeader && game.resultSettingData.isConfirmedRefund }">
					<td>{{ game.resourceId | resourceName }}</td>
					<td >
						<input [disabled]="resultDetailDisableInput[i]" type="text" />
					</td>
					<td >
						<input [disabled]="resultDetailDisableInput[i]" type="text" />
					</td>
					<td [ngClass]="game.ticketStatus.toLowerCase()">
						<input type="checkbox" [(ngModel)]="game.checked" (ngModelChange)="selectResult()" />
						
					</td>
				</tr>
				<tr>
					<td colspan="4" class="input-directly">
						<input type="checkbox" id="inputDirectly" [(ngModel)]="isDirectly"/>
						<label for="inputDirectly">Input HT Score and Final Score directly</label>
					</td>
				</tr>
				<tr>
					<td colspan="4">
						<button *ngIf="match.permission.isLeader" [ngClass]="{ 'btn btn-outline-primary button-confirmed': true }" [disabled]="selectedResources.length === 0" (click)="confirmRefund(hedgeMatchDetail, applyHedgeMatch)">
							Confirm/Undo-confirm Refund
						</button>
						<button [ngClass]="{ 'refund-button': true, 'button-disabled': selectedResources.length === 0 }" [disabled]="selectedResources.length === 0" (click)="refund()">Refund</button>
					</td>
				</tr>
			</tbody>
		</table>
        <div>
            - <strong>Settlement options for current match.</strong>
        </div>
        <div class="check-box">
            <input type="checkbox" [(ngModel)]="isSDTSettle"  id="isSDTSettle" />&nbsp;
			<label for="isSDTSettle">Settle determinable tickets of next results.</label>
        </div>
	</div>
</div>

<div *ngIf="blockUI" class="in modal-backdrop">
	<div class="loading"></div>
</div>
