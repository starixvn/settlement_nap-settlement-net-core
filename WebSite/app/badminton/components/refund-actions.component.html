<span toastContainer></span>
<div class="padding" *ngIf="match">
  <match-detail [match]="match" [isEarlySettlement]="false"></match-detail>
  <div class="refund-actions">
    <div class="normal-tickets">
      <div class="icon">
      </div>
      Normal Tickets
    </div>
    <div *ngIf="hedgeMatchDetail" class="hedge-match">
      <input type="checkbox" [(ngModel)]="applyHedgeMatch" id="ApplyHedgeMatch" />
      <label for="ApplyHedgeMatch">Apply for hedge match '<strong>{{hedgeMatchDetail.matchCode}}</strong>' also.</label>
    </div>
    <table>
      <thead>
        <tr>
          <th>Game/Match</th>
          <th>
            Select to Proceed
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let game of match.resultDetails | excludeTotalPoint; let last=last;"
          [ngClass]="{'confirmed-refund': permission.isLeader && game.resultSettingData.isConfirmedRefund}">
          <td>{{ game.resourceId | resourceName: match.matchDetail.sportType}}</td>
          <td [ngClass]="game.ticketStatus.toLowerCase()">
            <input type="checkbox" [(ngModel)]="game.checked" [disabled]="last? false : match.isScoreDirect" />
          </td>
        </tr>

        @if(isSupportSettleRelated) {
          <tr>
            <td colspan="2">
              <div style="display: flex;
                justify-content: flex-end;
                padding-right: 10px;">
                <span class="settle-related">
                  <input type="checkbox" id="settleRelated"  [(ngModel)] ="isSettleRelated"/>
                  <label for="settleRelated">Also refund <span class="link" (click)="openInfo()">
                      child-match.</span></label>
                </span>
              </div>
            </td>
          </tr>
        }

        <tr>
          <td colspan="2">
            <button *ngIf="permission.isLeader" [ngClass]="{'btn btn-outline-primary button-confirmed': true}"
              [disabled]="selectedResources.length === 0" (click)="confirmRefund()">
              Confirm/Undo-confirm Refund
            </button>
            <button [ngClass]="{'refund-button': true, 'button-disabled': selectedResources.length === 0}"
              [disabled]="selectedResources.length === 0" (click)="refund()">Refund</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div *ngIf="blockUI" class="in modal-backdrop">
  <div class="loading">
  </div>
</div>
