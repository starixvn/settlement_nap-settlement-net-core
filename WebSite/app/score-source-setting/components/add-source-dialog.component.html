<div class="add-source-dialog" cdkDragRootElement=".cdk-overlay-pane" cdkDragBoundary=".cdk-overlay-container" cdkDrag>
    <div cdkDragHandle class="modal-header">
        <div class="modal-title">New Outside Source</div>
        <button type="button" class="close" aria-label="Close" (click)="closePopup()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <div class="info row mx-0">
            <div class="title col-2">
                <label>Sport:</label>
            </div>
            <div class="content col-10">
                <select [(ngModel)]="sportSelected" class="select-sport" (ngModelChange)="changeSport()">
                    <option *ngFor="let item of sports" [ngValue]="item.sportType">{{item.sportName}}
                    </option>
                </select>
            </div>
        </div>
        <div class="info row mx-0">
            <div class="title col-2">
                <label>Name:</label>
            </div>
            <div class="content col-10">
                <input type="text" [(ngModel)]="sourceName" [ngClass]="{'warning': isErrorWhenSubmit()}">
            </div>
        </div>
        <div class="info row mx-0">
            <div class="title col-2">
                Link:
            </div>
            <div class="content col-10">
                <input type="text" [(ngModel)]="sourceLink">
            </div>
        </div>
        <div class="info row mx-0">
            <div class="title col-2">
                Game:
            </div>
            <div class="content col-10">
                <table>
                    <thead>
                        <tr>
                            <th class="game-name">
                                Game Type
                            </th>
                            <th class="is-active"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let game of games">
                            <td>{{game.name}}</td>
                            <td><input type="checkbox" [disabled]="disableGameType" [(ngModel)]="game.isActive"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="line"></div>
        <div class="row mx-0 info float-right">
            <button class="button" (click)="addNewSource()">Create</button>
            <button class="button btn-close" (click)="closePopup()">Close</button>
        </div>
    </div>
</div>
<div class="message-box" *ngIf="errorMessage">
    <div class="icon error"></div>
    <div class="message-info error">{{errorMessage}}</div>
</div>
