<div class="add-source-dialog" cdkDragRootElement=".cdk-overlay-pane" cdkDragBoundary=".cdk-overlay-container" cdkDrag>
    <div cdkDragHandle class="modal-header">
        <div class="modal-title">Edit Outside Source</div>
        <button type="button" class="close" aria-label="Close" (click)="closePopup()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <div class="info row mx-0">
            <div class="title col-3">
                <label>Sport:</label>
            </div>
            <div class="content col-9">
                <label>{{outsideSource.sportName}}</label>
            </div>
        </div>
        <div class="info row mx-0">
            <div class="title col-3">
                <label>Name:</label>
            </div>
            <div class="content col-9">
                <input type="text" [(ngModel)]="outsideSource.sourceName">
            </div>
        </div>
        <div class="info row mx-0">
            <div class="title col-3">
                Link:
            </div>
            <div class="content col-9">
                <input type="text" [(ngModel)]="outsideSource.remark">
            </div>
        </div>
        <div class="info row mx-0">
            <div class="title col-3">
                Is Active:
            </div>
            <div class="content col-9">
                <input type="checkbox" [(ngModel)]="outsideSource.sourceStatus">
            </div>
        </div>
        <div class="info row mx-0" *ngIf="!disabledGameType">
            <div class="title col-3">
                Game:
            </div>
            <div class="content col-9">
                <table>
                    <thead>
                        <tr>
                            <th class="game-name">
                                Game Type
                            </th>
                            <th class="is-active"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let game of outsideSource.games">
                            <td>{{game.name}}</td>
                            <td><input type="checkbox" [(ngModel)]="game.isActive"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="line"></div>
        <div class="row mx-0 info float-right">
            <button class="button" (click)="saveSource()">Save</button>
            <button class="button btn-close" (click)="closePopup()">Close</button>
        </div>
    </div>
</div>
<div class="message-box" *ngIf="errorMessage">
    <div class="icon error"></div>
    <div class="message-info error">{{errorMessage}}</div>
</div>
