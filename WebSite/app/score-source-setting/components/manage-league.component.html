<div class="manage-outside-source">
    <h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragBoundary=".cdk-overlay-container" cdkDragHandle>
        <label class="title">
            Manage League Outside Source
        </label>
        <button type="button" class="close dialog-close" (click)="close()">X</button>
    </h1>
    <div class="league-outside">
        <div class="icon">
        </div>
        <span class="sport-name">{{data.sportName}}</span> - {{data.leagueName}}
    </div>

    <div mat-dialog-content id="modal-body" style="padding: 5px 5px 0 5px !important;">
        <div>
            <label class="inner-label source">
                Outside Source:&nbsp;
            </label>
            <select [(ngModel)]="outsideSourceSelected" class="outside-source">
                <option *ngFor="let item of outsideSourceList" [ngValue]="item"> {{item.sourceName}}</option>
            </select>
            <button type="button" class="button button-add" (click)="addSource(outsideSourceSelected)" [disabled]="!activeAdd">Add</button>
        </div>

        <table class="source-table">
            <thead>
                <tr>
                    <td class="order">Order</td>
                    <td class="name-header">Outside Source Name</td>
                    <td class="link">Link</td>
                    <td class="action">Action</td>
                </tr>
            </thead>
            <tbody class="table-drag" cdkDropList (cdkDropListDropped)="drop($event)">
                <tr>
                    <td>{{screenShotSource.orderNo}}</td>
                    <td class="name-body">{{screenShotSource.sourceName}}</td>
                    <td class="name-body">{{screenShotSource.remark}}</td>
                    <td></td>
                </tr>
                <tr class="row-drag" *ngFor="let source of outsideSourceSort; let i = index" cdkDrag cdkDragLockAxis="y" cdkDragBoundary=".table-drag">
                    <td>{{i+2}}</td>
                    <td class="name-body">{{source.sourceName}}</td>
                    <td class="link">{{source.remark}}</td>
                    <td class="button-delete">
                        <button type="button" class="button delete-source" (click)="deleteSource(source)">x</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="line-source"></div>
        <div class="row mx-0 info float-right">
            <button class="button" (click)="save()">Save</button>
            <button class="button btn-close" (click)="close()">Close</button>
        </div>

    </div>
</div>
