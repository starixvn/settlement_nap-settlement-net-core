<table class="table-match">
  <ng-template *ngTemplateOutlet="header"></ng-template>
  <ng-template *ngTemplateOutlet="body"></ng-template>
</table>

<ng-template #header>
  <thead>
    <tr>
      <th>Event ID</th>
      <td>Kick-off Time</td>
      <td>Event</td>
      <td>
        Event Status
      </td>
    </tr>
  </thead>
</ng-template>

<ng-template #body>
  <tbody>
    <ng-template *ngFor="let item; in: leagueMatches">
      <tr>
        <td colspan="4">
          <div class="league-row">
            <span>
              {{ item.leagueName }}
            </span>
            <span>Code</span>
            <div class="league-action">
              <button>Calculate</button>
              <button>Uncalculate</button>
            </div>
          </div>
        </td>
      </tr>
      <tr *ngFor="let match in item.matches">
        <td></td>
        <td></td>
        <td></td>
      </tr>
    </ng-template>
  </tbody>
</ng-template>
`
<ng-template #empty>
  <!-- <div *ngIf="sports"> -->
  <div class="empty-data">
    There is no information available
  </div>
  <!-- </div> -->
</ng-template>
