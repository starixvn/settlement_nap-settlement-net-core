<table class="table-main">
  <ng-template *ngTemplateOutlet="header"></ng-template>
  <ng-template *ngTemplateOutlet="body"></ng-template>
</table>

<ng-template #header>
  <thead>
    <tr>
      <th class="event-id">Event ID</th>
      <td class="ko-time">Kick-off Time</td>
      <td>Event</td>
      <td class="event-status">
        Event Status
      </td>
    </tr>
  </thead>
</ng-template>

<ng-template #body>
  <!-- <div dynamicHeight class="table-content"> -->
  <tbody dynamicHeight class="table-body">
    <ng-container *ngIf="leagueMatch.length; else empty">
      <ng-container *ngFor="let item of leagueMatch">
        <tr>
          <td colspan="4">
            <div class="league-name">
              <div class="leangue-name__content">
                <span class="name">
                  {{ item.leagueName }}
                </span>
                <span class="code"> Code: {{ item.teams[0].matchCode }} </span>
                <button (click)="viewLog(item.teams[0].matchCode)">
                  View Log
                </button>
              </div>
              <div class="league-action">
                <button class="button">Calculate</button>
                <button class="button">Uncalculate</button>
              </div>
            </div>
          </td>
        </tr>
        <tr *ngFor="let team of item.teams">
          <td class="event-id">
            <span role="button" (click)="viewLog(team.orId)">{{
              team.orId
            }}</span>
          </td>
          <td class="ko-time">
            {{ team.kickOffTime | date: "mediumDate" }}
            {{ team.kickOffTime | date: "hh:mm:ss a" }}
          </td>
          <td class="team-name">{{ team.teamName }}</td>
          <td class="event-status">{{ team.status }}</td>
        </tr>
      </ng-container>
    </ng-container>
  </tbody>
  <!-- </div> -->
</ng-template>
`
<ng-template #empty>
  <tr class="empty-data">
    <td colspan="4">There is no information available</td>
  </tr>
</ng-template>
