<div class="filter-bar filter-bar-outright">
  <div class="line"></div>
  <div class="filter-bar-inner">
    <div class="row">
      <div class="field small-field">
        <label class="inner-label from-date">
          From
        </label>
        <ngbd-date-picker
          [date]="fromDate"
          [minDate]="moveBetsDay"
          (change)="onSelectFromDate($event)"
        ></ngbd-date-picker>
      </div>
      <div class="date">
        <input type="checkbox" style="float: left;" [(ngModel)]="disableToDate" (click)="changeStatus()">
        <label class="inner-label to-date">
          To
        </label>
        <ngbd-date-picker
          [date]="toDate"
          [minDate]="moveBetsDay"
          [disabled]="disableToDate"
          (change)="onSelectToDate($event)"
        ></ngbd-date-picker>
      </div>
    </div>
    <div class="row row-2">
      <div class="field">
        <label class="inner-label">
          Sport
        </label>
        <new-multiple-select [multipleSelect]="sportOptions$ | async" (formValue)="onSelectSport($event)"></new-multiple-select>
      </div>

      <div class="large-field league-field">
        <label class="inner-label">
          League
        </label>
        <new-multiple-select #league [multipleSelect]="leagueOptions$ | async" (formValue)="onSelectLeague($event)"></new-multiple-select>
      </div>

      <div class="field" style="margin-left: 100px;">
        <label class="inner-label">
          Status
        </label>
        <select [(ngModel)]="statusSelected">
          <option *ngFor="let item of statusOptions" [value]="item.value">{{
            item.text
          }}</option>
        </select>
      </div>

      <div class="submit field">
        <button class="button" (click)="search()">Submit</button>
      </div>
    </div>
  </div>
</div>
