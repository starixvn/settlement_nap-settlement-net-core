<div class="filter-bar">
  <div class="line"></div>
  <div class="filter-bar-inner">
    <div class="row">
      <div class="field small-field">
        <label class="inner-label from-date">
          From
        </label>
        <ngbd-date-picker
          [date]="fromDate"
          [minDate]="moveBetsDay"
          (change)="onSelectFromDate($event)"
        ></ngbd-date-picker>
      </div>
      <div class="date">
        <label class="inner-label to-date">
          To
        </label>
        <ngbd-date-picker
          [date]="toDate"
          [minDate]="moveBetsDay"
          (change)="onSelectToDate($event)"
        ></ngbd-date-picker>
      </div>
    </div>
    <div class="row row-2">
      <div class="field">
        <label class="inner-label">
          Sport
        </label>
        <select
          (ngModelChange)="onSelectSport($event)"
          [(ngModel)]="sportSelected"
        >
          <option *ngFor="let item of sportOptions" [value]="item.sportType">
            {{ item.sportName }}</option
          >
        </select>
      </div>

      <div class="field" style="width: auto; display: flex;">
        <label class="inner-label">
          League
        </label>
        <div style="position: relative;">
          <mat-select [(ngModel)]="leagueSelected" panelClass="testClass">
            <mat-option
              *ngFor="let item of leagueOptions; trackBy: trackByFn"
              [value]="item.leagueId"
              [matTooltip]="item.leagueName.length > 50 ? item.leagueName : ''"
              #tooltip="matTooltip"
              matTooltipPosition="right"
              >{{
                item.leagueName.length > 50
                  ? item.leagueName.substr(0, 50) + "..."
                  : item.leagueName
              }}</mat-option
            >
          </mat-select>
          <span class="chevron bottom"></span>
        </div>
      </div>
      <div class="field">
        <label class="inner-label">
          Status
        </label>
        <select [(ngModel)]="statusSelected">
          <option *ngFor="let item of statusOptions" [value]="item.value">{{
            item.text
          }}</option>
        </select>
      </div>

      <div class="submit field">
        <button class="button" (click)="search()">Submit</button>
      </div>
    </div>
  </div>
</div>
