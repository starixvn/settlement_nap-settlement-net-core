<div
  mat-dialog-title
  cdkDrag
  cdkDragRootElement=".cdk-overlay-pane"
  cdkDragBoundary=".cdk-overlay-container"
  cdkDragHandle
>
  <label class="title">
    Outright Log
  </label>
  <button
    type="button"
    class="close dialog-close"
    (click)="close()"
    tabindex="8"
  >
    X
  </button>
</div>

<log [request]="data"></log>
