<div class="filter-bar">
  <div class="line"></div>
  <div class="filter-bar-inner">
    <div class="row">
      <div class="field" style="width: auto;">
        <label class="inner-label">
          Match Id/ Match Code
        </label>
        <input type="text" maxlength="50" type="text" [(ngModel)]="matchCode" />
      </div>
      <div class="field small-field">
        <label class="inner-label from-date">
          From
        </label>
        <ngbd-date-picker
          [date]="fromDate"
          (change)="onSelectFromDate($event)"
        ></ngbd-date-picker>
      </div>
      <div class="date">
        <label class="inner-label to-date">
          To
        </label>
        <ngbd-date-picker
          [date]="toDate"
          (change)="onSelectToDate($event)"
        ></ngbd-date-picker>
      </div>
      <div class="submit field">
        <button class="button" (click)="search()">Submit</button>
      </div>
    </div>
  </div>
</div>

<div>
  <table class="table-calculation">
    <thead>
      <tr>
        <th>#</th>
        <th>Log Time</th>
        <th>Handled By</th>
        <th>Team Name</th>
        <th>Action</th>
        <th>Result String</th>
        <th>Remark</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let item of outrightLogDetails">
        <tr>
          <td>{{ item.logId }}</td>
          <td>
            {{ item.logDate | date: "mediumDate" }}
            {{ item.logDate | date: "hh:mm:ss a" }}
          </td>
          <td>{{ item.Username }}</td>
          <td>{{ item.teamName }}</td>
          <td>{{ item.actionNameEn }}</td>
          <td>{{ item.Result }}</td>
          <td>{{ item.Remark }}</td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
