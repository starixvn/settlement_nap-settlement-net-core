<div
  mat-dialog-title
  cdkDrag
  cdkDragRootElement=".cdk-overlay-pane"
  cdkDragBoundary=".cdk-overlay-container"
  cdkDragHandle
>
  <label class="title">
    Outright Calculation
  </label>
  <button
    type="button"
    class="close dialog-close"
    (click)="close()"
    tabindex="8"
  >
    X
  </button>
</div>

<div class="log-content">
  <div class="filter-bar">
    <div class="line"></div>
    <div class="filter-bar-inner">
      <div class="row">
        <div class="field" style="width: auto;">
          <label for="MatchCode" class="inner-label">
            MatchCode/ID
          </label>
          <input
            type="text"
            maxlength="50"
            type="text"
            [(ngModel)]="matchCode"
            class="match-code"
            required
          />
        </div>
        <div class="field small-field" style="width: auto;">
          <label class="inner-label from-date">
            From
          </label>
          <ngbd-date-picker
            [date]="fromDate"
            (change)="onSelectFromDate($event)"
          ></ngbd-date-picker>
        </div>
        <div class="date" style="width: auto;">
          <label class="inner-label to-date">
            To
          </label>
          <ngbd-date-picker
            [date]="toDate"
            (change)="onSelectToDate($event)"
          ></ngbd-date-picker>
        </div>
        <div class="submit field">
          <button class="button" (click)="search()">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngFor="let item of outrightLogs">
    <div (click)="onCollapsedClick(item)">
      <div class="league">
        <div class="btn-left"></div>
        <div class="btn-middle">
          <span>{{ item.leagueName }}</span>
        </div>
        <div [ngClass]="getBackgroundIcon(item.collapsed)"></div>
      </div>
    </div>
    <div [hidden]="item.collapsed">
      <table class="table-log">
        <thead>
          <tr>
            <th class="index" style="width: 5px;">#</th>
            <th>Log Time</th>
            <th>Handled By</th>
            <th>Team Name</th>
            <th>Action</th>
            <th>Result String</th>
            <th>Remark</th>
          </tr>
        </thead>
        <tbody dynamicHeight>
          <ng-container
            *ngFor="let log of item.outrightLogDetails; let i = index"
          >
            <tr>
              <td style="width: 30px;">{{ i + 1 }}</td>
              <td>
                {{ log.logDate | date: "mediumDate" }}
                {{ log.logDate | date: "hh:mm:ss a" }}
              </td>
              <td>{{ log.username }}</td>
              <td class="team-name text-left">{{ log.teamName }}</td>
              <td class="text-left">{{ log.actionNameEn }}</td>
              <td>{{ log.result }}</td>
              <td>{{ log.remark }}</td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>
</div>
