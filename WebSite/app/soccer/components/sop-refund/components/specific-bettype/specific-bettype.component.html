<h1 mat-dialog-title cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragBoundary=".cdk-overlay-container"
  cdkDragHandle>
  <label class="title">
    Specific bet types
  </label>
  <button type="button" class="close dialog-close" (click)="close()">X</button>
</h1>
<div class="specific-bettype-list multi-column">
  <ul>
    <li *ngFor="let betType of listBettype">{{ betType }}</li>
  </ul>
</div>
