<span toastContainer></span>
@if (match) {
<div class="calculate-popup">
  <div>
    <match-detail [match]="match" pageType="ReCalculate"></match-detail>
    <soccer-ticket-count [ticketCounts]="match.ticketCounts"></soccer-ticket-count>
    @if (hedgeMatchDetail) {
    <div class="hedge-match">
      <input type="checkbox" [(ngModel)]="applyHedgeMatch" [disabled]="hedgeMatchDetail.isUndecided"
        (ngModelChange)="changeApplyHedgeMatch()" />
      <label [matTooltip]="hedgeMatchDetail.isUndecided ? 'Disabled due to undecided hedge match.' : null"
        for="ApplyHedgeMatch">Apply for hedge match '<strong>{{hedgeMatchDetail.matchCode}}</strong>' also.</label>
    </div>
    }

    <calculation-action></calculation-action>
    <div class="calc-bottom">
      <resettle-checker [checked]="isReSettledTickets" class="resettle-checker"
        (proceedEvent)="onResettleCheckboxChange($event)"></resettle-checker>
      <goal-history [goalRecord]="matchDetail.goalRecord" class="goal-history"></goal-history>
    </div>
    @if (match.permission.canRefund && childMatches !== null && childMatches.length > 0) {
    <refund-child-match [matchDetail]="matchDetail" [(childMatches)]="childMatches"></refund-child-match>
    }
    @if (matchDetail.isFantasyMatch) {
    <fantasy [fantasyMatch]="match.fantasyMatch" (autoFillScore)="autoFillFantasyMatch($event)"></fantasy>
    }
  </div>

</div>
}
