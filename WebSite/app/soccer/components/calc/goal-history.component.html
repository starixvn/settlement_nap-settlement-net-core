<div class="goal-column">
  @if (isExistHalfTimeGoalRecord()) {
    <div class="ht-goal-record">
      <div class="header">
        HT Goal Record
      </div>
      <div class="content">
        @for (item of halfTimeGoalRecords; track item) {
          <div class="goal-row">
            <div class="goal-score">
              {{item.home}} - {{item.away}}
            </div>
            <div>
              {{item.team}}
            </div>
          </div>
        }
      </div>
    </div>
  }
  @if (isExistGoalRecord()) {
    <div class="goal-record">
      <div class="header">
        FT Goal Record
      </div>
      <div class="content">
        @for (item of fullTimeGoalRecords; track item) {
          <div class="goal-row">
            <div class="goal-score">
              {{item.home}} - {{item.away}}
            </div>
            <div>
              {{item.team}}
            </div>
          </div>
        }
      </div>
    </div>
  }
</div>
