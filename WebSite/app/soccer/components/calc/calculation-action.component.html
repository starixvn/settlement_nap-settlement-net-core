<div class="calculate-action">
  <table>
    <ng-template *ngTemplateOutlet="header"></ng-template>
    <ng-template *ngTemplateOutlet="body"></ng-template>
  </table>
</div>


<ng-template #header>
  <thead>
    <tr>
      <th scope="col" rowspan="2">Result</th>
      <th scope="col" rowspan="2">Ticket Status</th>
      <th scope="col" rowspan="2" colspan="2">Final Score</th>
      <th scope="col">Provider Score</th>
      <th scope="col" rowspan="2">
        Select to Proceed
      </th>
      <th scope="col" rowspan="2">Hold Result</th>
    </tr>
    <tr>
      <th scope="col"> SBO <span class="icon-copy" (click)="copyScore()"></span></th>
    </tr>
  </thead>
</ng-template>

<ng-template #body>
  <tbody>
    <tr>
      <td style="font-weight: bold;">First Half</td>
      <td [ngClass]="matchDetail.htStatus.toLowerCase()" class="set-status">{{ matchDetail.htStatus }}
      </td>
      <td [ngClass]="halfTimeResult.resultState">
        <input type="text" myOnlyInteger tabindex="1" [ngClass]="{'warning':matchDetail.isWarningHalfTimeHomeScore}"
          [disabled]="!halfTimeResult.checked  || halfTimeResult.resultSettingData.isHoldResult"
          [(ngModel)]="halfTimeResult.homeValue" (ngModelChange)="scoreChanged(halfTimeResult)" />
      </td>
      <td [ngClass]="halfTimeResult.resultState">
        <input type="text" myOnlyInteger tabindex="2" [ngClass]="{'warning':matchDetail.isWarningHalfTimeAwayScore}"
          [disabled]="!halfTimeResult.checked  || halfTimeResult.resultSettingData.isHoldResult"
          [(ngModel)]="halfTimeResult.awayValue" (ngModelChange)="scoreChanged(halfTimeResult)" />
      </td>
      <td [ngClass]="{ mismatched: halfTimeResult.isMismatch}">
        {{ matchDetail.exHTHomeScore }} - {{ matchDetail.exHTAwayScore }}
      </td>
      <td>
        <input id="final-checkbox" type="checkbox" [(ngModel)]="halfTimeResult.checked"
          [disabled]="halfTimeResult.resultSettingData.isHoldResult" (ngModelChange)="selectResult()" />
      </td>
      <td>
        <div [ngClass]="halfTimeResult.resultSettingData.iconHoldResult" (click)="isChangeSetting(halfTimeResult)">
        </div>
      </td>
    </tr>
    <tr>
      <td style="font-weight: bold;">Full Time</td>
      <td [ngClass]="matchDetail.ftStatus.toLowerCase()" class="set-status">{{ matchDetail.ftStatus }}
      </td>
      <td [ngClass]="fullTimeResult.resultState">
        <input type="text" myOnlyInteger tabindex="3" [ngClass]="{'warning':matchDetail.isWarningFinalHomeScore}"
          [disabled]="!fullTimeResult.checked || fullTimeResult.resultSettingData.isHoldResult"
          [(ngModel)]="fullTimeResult.homeValue" />
      </td>
      <td [ngClass]="fullTimeResult.resultState">
        <input type="text" myOnlyInteger tabindex="4" [ngClass]="{'warning':matchDetail.isWarningFinalAwayScore}"
          [disabled]="!fullTimeResult.checked || fullTimeResult.resultSettingData.isHoldResult"
          [(ngModel)]="fullTimeResult.awayValue" />
      </td>
      <td [ngClass]="{ mismatched: fullTimeResult.isMismatch}">
        {{ matchDetail.exFTHomeScore }} - {{ matchDetail.exFTAwayScore }}
      </td>
      <td>
        <input id="final-checkbox" type="checkbox" [(ngModel)]="fullTimeResult.checked"
          [disabled]="fullTimeResult.resultSettingData.isHoldResult" (ngModelChange)="selectResult()" />
      </td>
      <td>
        <div [ngClass]="fullTimeResult.resultSettingData.iconHoldResult" (click)="isChangeSetting(fullTimeResult)">
        </div>
      </td>
    </tr>
    <tr class="soccer">
      <td colSpan="100%" class="set-directly">
        <input type="checkbox" [(ngModel)]="matchDetail.applyGoalRecord" id="apply-goal-record"
          [disabled]="disableGoalRecordCheckbox">
        <label for="apply-goal-record">Goal Record</label>
        <input type="text" maxlength="50"
          [ngClass]="{'goal-record-input':1, 'warning':matchDetail.isWarningGoalRecord && matchDetail.applyGoalRecord}"
          [(ngModel)]="matchDetail.goalRecord" myOnlyGoalRecord [disabled]="!matchDetail.applyGoalRecord"
          (ngModelChange)="goalRecordModelChange($event)">
      </td>
    </tr>
    <tr>
      <td colSpan="100%" class="action-button">
        <button [ngClass]="{ button: true}" [disabled]="!enableAction" (click)="calculate()">Calculate</button>

        <button *ngIf="permission.canUncalculate" [ngClass]="{ button: true}" [disabled]="!enableAction"
          (click)="uncalculate()">
          Uncalculate
        </button>

        <button *ngIf="permission.canUncalculateInstant" [ngClass]="{ 'button instant': true}"
          [disabled]="!enableAction" (click)="unCalcInstant()">
          Uncalculate Ins.Settle
        </button>
        <button class="new-refund-button save-score" [disabled]="!enableAction" (click)="saveScore()">Save
          Trader Score</button>
      </td>
    </tr>
  </tbody>
</ng-template>
