<tr>
  <th rowspan="2" class="bettype-name">
    Result Type
    <div class="early-filter">
      <new-multiple-select (formValue)="onSelectFilter($event, filterId.resultType)"
        [multipleSelect]="resultTypeSelect"></new-multiple-select>
    </div>
  </th>
  <th rowspan="2" class="ticket-status">
    Ticket Status
    <div class="early-filter">
      <new-multiple-select (formValue)="onSelectFilter($event, filterId.ticketStatus)"
        [multipleSelect]="ticketsStatusSelect"></new-multiple-select>
    </div>
  </th>
  <th rowspan="2" class="final-result">
    Final Result
  </th>
  <th rowspan="2" class="map" *ngIf="permission.isLeader">
    Trader Result
  </th>
  <th [colSpan]="maxProviderCol" *ngIf="permission.isLeader">
    Provider Result
  </th>
  <th [colSpan]="outSideCount">
    Outside Result
  </th>
  <th rowspan="2" class="result">
    Result Status
    <div class="early-filter">
      <new-multiple-select (formValue)="onSelectFilter($event, filterId.resultStatus)"
        [multipleSelect]="resultStatusSelect"></new-multiple-select>
    </div>
  </th>
  <th rowspan="2" class="select-proceed">
    Select to Proceed
  </th>
  <th rowspan="2" class="hold-result">
    Hold Result
  </th>
</tr>
<tr>
  <ng-container *ngFor=" let result of match().resultDetails[0].externalScores | slice:1; let i=index">
    <th class="map" *ngIf="i < maxProviderCol && permission.isLeader">
      <div class="outside-source-text" [matTooltip]="getTextTooltip(result.sourceName, 15)">
        {{result.sourceName}}
      </div>
    </th>
    <th class="map" *ngIf="i === maxProviderCol">
      <div class="outside-source-text">
        {{result.sourceName}}
      </div>
    </th>
    <th class="map" *ngIf="i > maxProviderCol">
      <div class="outside-source-text" [matTooltip]="getTextTooltip(result.sourceName, 15)">
        <a href="{{result.remark | externalLink}}" target="_blank" class="source-link">{{result.sourceName}}</a>
      </div>
    </th>
  </ng-container>
</tr>
