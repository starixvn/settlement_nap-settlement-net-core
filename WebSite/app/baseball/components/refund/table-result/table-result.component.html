<div class="refund-actions">
  <div class="normal-tickets">
    <div class="icon">
    </div>
    Normal Tickets
  </div>
  <div *ngIf="hedgeMatchDetail" class="hedge-match">
    <input type="checkbox" [(ngModel)]="applyHedgeMatch" id="ApplyHedgeMatch" />
    <label for="ApplyHedgeMatch">Apply for hedge match '<strong>{{hedgeMatchDetail.matchCode}}</strong>' also.</label>
  </div>
  <table>
    <thead>
      <tr>
        <th class="resource-name">Result name</th>
        <th class="result">Final Score</th>
        <th class="proceed">
          Select to Proceed
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let inning of resultDetails; let i = index; let last=last;"
        [ngClass]="{'confirmed-refund': permission.isLeader && (inning.resultSettingData.isConfirmedRefund || inning.resultSettingData.isConfirmedRefundSdt || inning.resultSettingData.isConfirmedRefundMercy),
                  'striped': inning.resourceId !== resourceIds.totalHits && ((i % 2 == 0 || inning.resourceId === resourceIds.fullTime || inning.resourceId === resourceIds.extraInning) && !isMatchSeries)}">
        <td [ngClass]="{'mercy': permission.isLeader && inning.otherInfo === 'Mercy'}">{{ inning.resourceName}}</td>
        <td [ngClass]="inning.className">
           <div class="score score-row">
            <span class="score-row__team" [matTooltip]="getTextTooltip(homeName,20)" matTooltipPosition="above">{{homeName}}</span>
            <input type="text" myOnlyInteger [disabled]="inning.disabled " [(ngModel)]="inning.homeValue" (ngModelChange)="changeScore(inning)"/>
          </div>
          <div class="score score-row">
            <span class="score-row__team" [matTooltip]="getTextTooltip(awayName,20)" matTooltipPosition="above">{{awayName}}</span>
            <input type="text" myOnlyInteger [disabled]="inning.disabled" [(ngModel)]="inning.awayValue" (ngModelChange)="changeScore(inning)"/>
          </div> 
        </td>
        <td *ngIf="inning.resourceId === resourceIds.extraInning" rowspan="2" class="status temp">
          <input id="final-checkbox" type="checkbox" [(ngModel)]="resultDetails[i + 1].checked"
          [disabled]="disableTotalHitsAndMatch(resultDetails[i + 1].resourceId)" (ngModelChange)="enableInput(inning, resultDetails[i + 1])" />
        </td>
        <td class="temp" *ngIf="!isMatchSeries && (inning.resourceId !== resourceIds.extraInning && inning.resourceId !== resourceIds.fullTime)">
          <input type="checkbox" [(ngModel)]="inning.checked" [disabled]="disableTotalHitsAndMatch(inning.resourceId)" (ngModelChange)="enableInput(null, inning)"/>
        </td>
        <td class="temp" *ngIf="isMatchSeries">
          <input type="checkbox" [(ngModel)]="inning.checked" [disabled]="disableTotalHitsAndMatch(inning.resourceId)" (ngModelChange)="enableInput(null, inning)"/>
        </td>
      </tr>

      <tr>
        <td colspan="3">
          <button
							*ngIf="!isConfirmRefund && permission.isLeader"
							class="btn btn-outline-primary button-confirmed"
							[disabled]="disableButton"
							(click)="confirmRefund()"
						>
							Confirm Refund
						</button>
						<button
							*ngIf="isConfirmRefund && permission.isLeader"
							class="btn btn-outline-primary button-confirmed"
							(click)="undoConfirmedAllResult()"
						>
							Undo Confirm Refund All
						</button>
          <button class="btn btn-outline-primary" [disabled]="disableButton" (click)="refund()">Refund</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
