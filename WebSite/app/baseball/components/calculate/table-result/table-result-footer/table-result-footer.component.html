<tr>
  <td colspan="100%" class="input-directly">
    <input type="checkbox" [(ngModel)]="isInputScoreDirect" (ngModelChange)="changeInputDirectly()" id="isScoreDirect"
      [disabled]="disableScoreDirect" />
    <label for="isScoreDirect">Input Match score directly</label>
  </td>
</tr>

<tr>
  <td colSpan="100%" class="button-group">
    <button class="button" (click)="calculate()" [disabled]="!isReadyMatch">Calculate</button>
    <button *ngIf="canUncalculate" [ngClass]="{ button: true, 'button-disabled': disableUncalculateAndSaveScore }"
      [disabled]="disableUncalculateAndSaveScore" (click)="uncalculate()">
      Uncalculate
    </button>
    <button class="new-refund-button save-score" [disabled]="disableUncalculateAndSaveScore" (click)="saveScore()">Save
      Score</button>
  </td>
</tr>
