<td colspan="13" class="name" (click)="collapseLeague()">
  <span class="collapse-icon" [ngClass]="league.collapse ? 'collapsed' : ''"></span>
  &nbsp;{{ league.name }}
</td>
<td class="auto-setting" (click)="!sportSupportInstant.includes(league.sportType) && collapseLeague()">
  @if (sportSupportInstant.includes(league.sportType)) {
  <span [class]="getClassInstant()" (click)="updateInstantForLeague()"> </span>
  }
</td>
<td class="remark-status instant-time">
  <ng-container *ngIf="league.matches[0].applyDirect && !sportSupportNewAutoPayout.includes(league.sportType)">
    <div *ngIf="permission.canAutoPayout" class="act-direct-time" [matTooltip]="language.payout.titleDirectTime"
      matTooltipPosition="above" (click)="openUpdateTime()"></div>
    <div>Waiting time: {{ league.autoWaitingTime }}sec</div>
  </ng-container>
  <ng-container *ngIf="sportSupportNewAutoPayout.includes(league.sportType)">
    <div class="auto-info">
      <span>Waiting time: {{ league.autoWaitingTime | timeConverter }}</span> <br />
      <span>Retry time: {{ league.autoRetryTime | timeConverter }}</span>
    </div>
  </ng-container>
</td>

<td [ngClass]="{ 'code-link enable': permission.canAutoPayout, 'auto-setting auto-setting-text': true }">
  <div class="cursor-pointer" (click)="changeAutoLeague()">{{getAutoSettingLeague() }}</div>
</td>
