<div class="filter-bar">
    <div class="line">
    </div>


    <div class="filter-bar-inner">
        <div class="row">
            <div class="col-md-2">
                <label for="FromDate" class="inner-label from-date">
                    From
                </label>
                <ngbd-date-picker [date]="fromDate" (change)="onSelectFromDate($event)"></ngbd-date-picker>
            </div>
            <div class="to-date-field">
                <label for="ToDate" class="inner-label to-date">
                    To
                </label>
                <ngbd-date-picker [date]="toDate" (change)="onSelectToDate($event)"></ngbd-date-picker>
            </div>
            <div class="col-md-7">
                <div class="row">
                    <div class="col-md-1 field">
                        <input id="HTOver" name="HTOver" type="checkbox" value="true"
                            [(ngModel)]="query.htOver">
                        <label for="HTOver" class="bold">&nbsp; HT Over
                        </label>
                    </div>
                    <div class="col-md-1 field">
                        <input id="FTOver" name="FTOver" type="checkbox" value="true"
                            [(ngModel)]="query.ftOver">
                        <label for="FTOver" class="bold">&nbsp; FT Over
                        </label>
                    </div>
                    <div class="col-md-1 field">
                        <input id="EarlyOver" name="EarlyOver" type="checkbox" value="true"
                            [(ngModel)]="query.earlyOver">
                        <label for="EarlyOver" class="bold">&nbsp; Early Over
                        </label>
                    </div>
                
                    <div class="col-md-2 field">
                        <input id="EarlyOnly" name="EarlyOnly" type="checkbox" value="true"
                            [(ngModel)]="query.autoSettlementOnly">
                        <label for="EarlyOnly" class="bold">&nbsp;Running Early Settle Only</label>
                    </div>
                    <div class="col-md-2 field">
                        <input id="FastMarketsOnly" name="FastMarketsOnly" type="checkbox" value="true"
                            [(ngModel)]="query.fastMarketsOnly">
                        <label for="FastMarketsOnly" class="bold">&nbsp;Fast Markets Only</label>
                    </div>
                    <div class="col-md-2 field">
                        <input id="IsMarkedTicket" name="IsMarkedTicket" type="checkbox" value="true"
                            [(ngModel)]="query.isMarkedTicket">
                        <label for="IsMarkedTicket" class="bold">&nbsp;Marked Tickets</label>
                    </div>
                    <div class="col-md-3">
                        <label for="StatusId" class="inner-label">
                            Status
                        </label>
                        <select [(ngModel)]="query.statusId">
                            <option *ngFor="let item of statuses" [value]="item.value">{{item.text}}</option>
                        </select>

                    </div>
                </div>
            </div>
        </div>
        <div class="row" style="margin-top: 5px">
            <div class="col-md-2">
                <label for="matchCode" class="inner-label">
                    Match Code/ID
                </label>
                <input id="MatchCode" maxlength="50" name="MatchCode" style="width: 107px" type="text" value=""
                    [(ngModel)]="query.matchCode">
            </div>
            <div class="league-list">
                <label for="LeagueId" style="margin-left: 4px;" class="inner-label">League</label>
                <select [(ngModel)]="query.leagueId" class="league-select">
                    <option *ngFor="let item of leagues" [value]="item.leagueId">{{item.leagueName}}</option>
                </select>
            </div>
            <div class="col-md-1 field">
                <input id="IsIncludeTest" name="IsIncludeTest" type="checkbox" value="true"
                    [(ngModel)]="query.isIncludeTest">
                <label for="IsIncludeTest" class="bold">&nbsp;Include Test Matches</label>
            </div>
            <div class="col-md-1">
                <button class="button" id="SubmitButton" (click)="search()" [disabled]="isDisabled">Submit</button>
            </div>
        </div>
    </div>
</div>

<div class="line">
</div>
